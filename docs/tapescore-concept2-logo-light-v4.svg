<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-labelledby="title desc">
  <title id="title">TapeScore Concept 2 light wordmark with clean S knockout</title>
  <desc id="desc">TapeScore wordmark with one irregular auction profile, clear HVNs and LVN, and no profile bars passing through the capital S.</desc>
  <defs>
    <mask id="clear-s" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="150">
      <rect width="560" height="150" fill="white"/>
      <text x="236" y="113" fill="black" stroke="black" stroke-width="9" stroke-linejoin="round" paint-order="stroke fill" font-family="Inter, Geist, 'Helvetica Neue', Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-4.2">S</text>
    </mask>
  </defs>
  <g mask="url(#clear-s)" shape-rendering="geometricPrecision">
    <rect x="244" y="22" width="76" height="6" rx="1.5" fill="#A6A6A6"/><rect x="224" y="30" width="118" height="6" rx="1.5" fill="#A6A6A6"/><rect x="205" y="38" width="156" height="7" rx="1.5" fill="#D6D8D5"/><rect x="195" y="47" width="176" height="7" rx="1.5" fill="#A6A6A6"/><rect x="214" y="56" width="132" height="6" rx="1.5" fill="#D6D8D5"/><rect x="233" y="64" width="92" height="6" rx="1.5" fill="#A6A6A6"/><rect x="254" y="72" width="48" height="5" rx="1.5" fill="#D6D8D5"/><rect x="246" y="80" width="62" height="5" rx="1.5" fill="#A6A6A6"/><rect x="228" y="88" width="104" height="6" rx="1.5" fill="#D6D8D5"/><rect x="209" y="96" width="150" height="6" rx="1.5" fill="#A6A6A6"/><rect x="192" y="104" width="182" height="7" rx="1.5" fill="#D6D8D5"/><rect x="204" y="113" width="162" height="7" rx="1.5" fill="#A6A6A6"/><rect x="222" y="122" width="120" height="6" rx="1.5" fill="#D6D8D5"/><rect x="236" y="130" width="94" height="6" rx="1.5" fill="#A6A6A6"/>
    <g fill="#B9802B"><rect x="338" y="38" width="23" height="7" rx="1.5"/><rect x="278" y="47" width="93" height="7" rx="1.5"/><rect x="338" y="96" width="21" height="6" rx="1.5"/><rect x="268" y="104" width="106" height="7" rx="1.5"/></g>
  </g>
  <text x="20" y="113" fill="#17181A" font-family="Inter, Geist, 'Helvetica Neue', Arial, sans-serif" font-size="104" letter-spacing="-4.2"><tspan font-weight="500">Tape</tspan><tspan font-weight="800">Score</tspan></text>
</svg>
