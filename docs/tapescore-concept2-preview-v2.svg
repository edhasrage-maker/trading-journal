<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">TapeScore Concept 2 high-visibility preview</title>
  <desc id="desc">Revised TapeScore wordmark emphasizing an unmistakable volume-by-price profile.</desc>
  <rect width="1440" height="900" fill="#0E0F11"/>
  <text x="72" y="72" fill="#E0A33C" font-family="Inter, Geist, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.6">CONCEPT 2 — REVISED</text>
  <text x="310" y="72" fill="#A6A6A6" font-family="Inter, Geist, Arial, sans-serif" font-size="18" letter-spacing="1.6">HIGH-VISIBILITY VOLUME PROFILE</text>
  <image href="tapescore-concept2-logo-dark-v2.svg" x="72" y="118" width="970" height="260"/>
  <text x="1090" y="153" fill="#E0A33C" font-family="Inter, Geist, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">VOLUME-BY-PRICE</text>
  <text x="1090" y="190" fill="#D6D8D5" font-family="Inter, Geist, Arial, sans-serif" font-size="17"><tspan x="1090" dy="0">Stepped distribution.</tspan><tspan x="1090" dy="28">Neutral bid side.</tspan><tspan x="1090" dy="28">Amber price nodes.</tspan><tspan x="1090" dy="28">Instant trader recognition.</tspan></text>
  <line x1="72" y1="428" x2="1368" y2="428" stroke="#404347"/>
  <rect x="72" y="478" width="828" height="250" rx="18" fill="#F7F7F4"/>
  <text x="102" y="520" fill="#6B6B6B" font-family="Inter, Geist, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">LIGHT MODE</text>
  <image href="tapescore-concept2-logo-light-v2.svg" x="96" y="535" width="770" height="184"/>
  <text x="960" y="510" fill="#E0A33C" font-family="Inter, Geist, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SYMBOL MARK</text>
  <rect x="960" y="540" width="220" height="220" rx="28" fill="#0B0B0D" stroke="#4A4D50"/>
  <image href="tapescore-concept2-mark-v2.svg" x="993" y="573" width="154" height="154"/>
  <text x="1222" y="575" fill="#A6A6A6" font-family="Inter, Geist, Arial, sans-serif" font-size="13" letter-spacing="1.3">THE PROFILE NOW READS</text>
  <text x="1222" y="605" fill="#E7E8E5" font-family="Inter, Geist, Arial, sans-serif" font-size="21" font-weight="700">before the letterform.</text>
  <text x="1222" y="646" fill="#A6A6A6" font-family="Inter, Geist, Arial, sans-serif" font-size="15"><tspan x="1222" dy="0">Brighter neutral bars expose</tspan><tspan x="1222" dy="25">the silhouette; amber nodes</tspan><tspan x="1222" dy="25">signal traded price levels.</tspan></text>
  <line x1="72" y1="814" x2="1368" y2="814" stroke="#404347"/>
  <g font-family="Inter, Geist, Arial, sans-serif" font-size="14" letter-spacing="1"><rect x="72" y="846" width="28" height="28" rx="5" fill="#E7E8E5"/><text x="114" y="866" fill="#A6A6A6">WORDMARK  #E7E8E5</text><rect x="352" y="846" width="28" height="28" rx="5" fill="#A6A6A6"/><text x="394" y="866" fill="#A6A6A6">PROFILE  #A6A6A6</text><rect x="620" y="846" width="28" height="28" rx="5" fill="#6B6B6B"/><text x="662" y="866" fill="#A6A6A6">SECONDARY  #6B6B6B</text><rect x="955" y="846" width="28" height="28" rx="5" fill="#E0A33C"/><text x="997" y="866" fill="#A6A6A6">PRICE NODE  #E0A33C</text></g>
</svg>
