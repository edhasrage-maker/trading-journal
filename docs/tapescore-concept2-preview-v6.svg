<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">TapeScore Concept 2 refined preview</title>
  <desc id="desc">A balanced, restrained revision of the volume-profile TapeScore identity.</desc>
  <rect width="1440" height="900" fill="#0E0F11"/>
  <text x="72" y="72" fill="#E0A33C" font-family="Inter, Geist, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.6">CONCEPT 2 — REFINED RESET</text>
  <text x="400" y="72" fill="#A6A6A6" font-family="Inter, Geist, Arial, sans-serif" font-size="18" letter-spacing="1.6">BALANCED, QUIET, INTEGRATED</text>
  <image href="tapescore-concept2-logo-dark-v6.svg" x="72" y="118" width="970" height="260"/>
  <g font-family="Inter, Geist, Arial, sans-serif"><text x="1082" y="145" fill="#E0A33C" font-size="15" font-weight="800" letter-spacing="1.4">DESIGN PRIORITY</text><text x="1082" y="184" fill="#D6D8D5" font-size="16"><tspan x="1082" dy="0">A strong wordmark first.</tspan><tspan x="1082" dy="26">Trading DNA second.</tspan><tspan x="1082" dy="26">No diagram-like clutter.</tspan></text><text x="1082" y="290" fill="#A6A6A6" font-size="13" font-weight="700" letter-spacing="1.2">PROFILE TREATMENT</text><text x="1082" y="322" fill="#E7E8E5" font-size="18" font-weight="700">Compact. Restrained. Clean S.</text></g>
  <line x1="72" y1="428" x2="1368" y2="428" stroke="#404347"/>
  <rect x="72" y="478" width="828" height="250" rx="18" fill="#F7F7F4"/>
  <text x="102" y="520" fill="#6B6B6B" font-family="Inter, Geist, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">LIGHT MODE</text>
  <image href="tapescore-concept2-logo-light-v6.svg" x="96" y="535" width="770" height="184"/>
  <text x="960" y="510" fill="#E0A33C" font-family="Inter, Geist, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">SYMBOL MARK</text>
  <rect x="960" y="540" width="220" height="220" rx="28" fill="#0B0B0D" stroke="#4A4D50"/>
  <image href="tapescore-concept2-mark-v6.svg" x="993" y="573" width="154" height="154"/>
  <g font-family="Inter, Geist, Arial, sans-serif"><text x="1222" y="574" fill="#A6A6A6" font-size="13" letter-spacing="1.3">VISUAL CHARACTER</text><text x="1222" y="610" fill="#E7E8E5" font-size="20" font-weight="700">Confident, not literal</text><text x="1222" y="649" fill="#A6A6A6" font-size="15"><tspan x="1222" dy="0">Fewer intentional bars.</tspan><tspan x="1222" dy="25">Restrained amber signal.</tspan><tspan x="1222" dy="25">No interference with S.</tspan></text></g>
  <line x1="72" y1="814" x2="1368" y2="814" stroke="#404347"/>
  <g font-family="Inter, Geist, Arial, sans-serif" font-size="14" letter-spacing="1"><rect x="72" y="846" width="28" height="28" rx="5" fill="#E7E8E5"/><text x="114" y="866" fill="#A6A6A6">WORDMARK</text><rect x="330" y="846" width="28" height="28" rx="5" fill="#A6A6A6"/><text x="372" y="866" fill="#A6A6A6">PROFILE</text><rect x="650" y="846" width="28" height="28" rx="5" fill="#0E0F11" stroke="#6B6B6B"/><text x="692" y="866" fill="#A6A6A6">CLEAN S ZONE</text><rect x="990" y="846" width="28" height="28" rx="5" fill="#E0A33C"/><text x="1032" y="866" fill="#A6A6A6">SIGNAL</text></g>
</svg>
