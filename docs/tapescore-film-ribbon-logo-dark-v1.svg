<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">TapeScore film-ribbon wordmark</title>
  <desc id="desc">TapeScore wordmark over a clean film strip following a candlestick market-structure path.</desc>
  <g shape-rendering="geometricPrecision">
    <!-- One continuous game-tape ribbon: impulse, pullback, continuation. -->
    <path d="M176 169 L274 78 L382 124 L548 36" fill="none" stroke="#777B80" stroke-width="34" stroke-linecap="square" stroke-linejoin="bevel" opacity=".56"/>
    <path d="M176 169 L274 78 L382 124 L548 36" fill="none" stroke="#24282D" stroke-width="22" stroke-linecap="square" stroke-linejoin="bevel" opacity=".8"/>
    <!-- Film perforations, limited to the visible outside edge. -->
    <g fill="#0E0F11" opacity=".96">
      <rect x="187" y="142" width="10" height="6" rx="1.5" transform="rotate(-43 192 145)"/><rect x="208" y="123" width="10" height="6" rx="1.5" transform="rotate(-43 213 126)"/><rect x="229" y="103" width="10" height="6" rx="1.5" transform="rotate(-43 234 106)"/><rect x="250" y="84" width="10" height="6" rx="1.5" transform="rotate(-43 255 87)"/>
      <rect x="290" y="79" width="10" height="6" rx="1.5" transform="rotate(23 295 82)"/><rect x="316" y="90" width="10" height="6" rx="1.5" transform="rotate(23 321 93)"/><rect x="342" y="101" width="10" height="6" rx="1.5" transform="rotate(23 347 104)"/><rect x="367" y="112" width="10" height="6" rx="1.5" transform="rotate(23 372 115)"/>
      <rect x="399" y="99" width="10" height="6" rx="1.5" transform="rotate(-28 404 102)"/><rect x="426" y="85" width="10" height="6" rx="1.5" transform="rotate(-28 431 88)"/><rect x="453" y="70" width="10" height="6" rx="1.5" transform="rotate(-28 458 73)"/><rect x="481" y="56" width="10" height="6" rx="1.5" transform="rotate(-28 486 59)"/><rect x="509" y="41" width="10" height="6" rx="1.5" transform="rotate(-28 514 44)"/>
    </g>
    <!-- Eight candles: enough to read as price action, not a miniature chart. -->
    <g stroke-linecap="round">
      <g transform="translate(218 135)"><line y1="-24" y2="24" stroke="#A6A6A6" stroke-width="2.5"/><rect x="-6" y="-7" width="12" height="20" rx="2" fill="#6B6B6B"/></g>
      <g transform="translate(254 98)"><line y1="-28" y2="25" stroke="#E0A33C" stroke-width="2.5"/><rect x="-6" y="-14" width="12" height="25" rx="2" fill="#E0A33C"/></g>
      <g transform="translate(292 88)"><line y1="-27" y2="25" stroke="#E0A33C" stroke-width="2.5"/><rect x="-6" y="-10" width="12" height="23" rx="2" fill="#E0A33C"/></g>
      <g transform="translate(333 104)"><line y1="-24" y2="24" stroke="#A6A6A6" stroke-width="2.5"/><rect x="-6" y="-12" width="12" height="21" rx="2" fill="#6B6B6B"/></g>
      <g transform="translate(376 118)"><line y1="-22" y2="23" stroke="#A6A6A6" stroke-width="2.5"/><rect x="-6" y="-8" width="12" height="20" rx="2" fill="#6B6B6B"/></g>
      <g transform="translate(421 99)"><line y1="-27" y2="24" stroke="#E0A33C" stroke-width="2.5"/><rect x="-6" y="-13" width="12" height="24" rx="2" fill="#E0A33C"/></g>
      <g transform="translate(467 73)"><line y1="-27" y2="24" stroke="#E0A33C" stroke-width="2.5"/><rect x="-6" y="-14" width="12" height="25" rx="2" fill="#E0A33C"/></g>
      <g transform="translate(515 48)"><line y1="-25" y2="22" stroke="#A6A6A6" stroke-width="2.5"/><rect x="-6" y="-8" width="12" height="21" rx="2" fill="#6B6B6B"/></g>
    </g>
    <!-- Wordmark remains dominant and clean. -->
    <text x="38" y="176" fill="#E7E8E5" stroke="#0E0F11" stroke-width="1.7" paint-order="stroke fill" font-family="Inter, Geist, 'Helvetica Neue', Arial, sans-serif" font-size="112" letter-spacing="-4.8"><tspan font-weight="500">Tape</tspan><tspan font-weight="800">Score</tspan></text>
  </g>
</svg>
